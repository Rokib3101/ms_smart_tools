name: shared_ui
description: "Shared UI components, theme, and security utilities for MS Smart Tools"
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.3
  provider: ^6.1.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  file_picker: ^8.0.7
  share_plus: ^9.0.0
  math_expressions: ^2.4.0
  core_database:
    path: ../core_database
