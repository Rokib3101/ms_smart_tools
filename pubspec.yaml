name: ms_smart_tools
description: "MS Smart Tools"
version: 1.6.3+63
publish_to: 'none'

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  provider: ^6.1.1
  uuid: ^4.2.1
  intl: ^0.19.0
  fl_chart: ^0.66.0
  math_expressions: ^2.4.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  image_picker: ^1.1.2
  screenshot: ^3.0.0
  gal: ^2.3.3
  receive_sharing_intent: 1.8.1
  image: ^4.2.0
  path: ^1.9.0
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
