name: ms_finance
description: "MS Finance - Personal Finance, Cash Counter, Price Comparator & Shopping Manager"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  go_router: ^14.2.0
  shared_ui:
    path: ../../packages/core/shared_ui
  core_database:
    path: ../../packages/core/core_database
  ms_smart_tools:
    path: ../../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/MS Finance.png"

flutter:
  uses-material-design: true
