name: ms_image
description: "MS Image - QR Scanner, QR Generator, Document Scanner & Image Tools"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^14.2.0
  shared_ui:
    path: ../../packages/core/shared_ui
  image_features:
    path: ../../packages/features/image_features

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/MS Image.png"

flutter:
  uses-material-design: true
